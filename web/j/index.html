<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rotash に招待されました</title>
<meta name="description" content="友達と1週間かけて、7枚で1つの写真作品をつくるアプリ。">
<meta property="og:title" content="Rotash に招待されました">
<meta property="og:description" content="撮るのは1日にひとりだけ。7日で1枚の作品になる。">
<style>
  :root {
    --bg: #0a0a0a; --surface: #1a1a1a; --line: #3d3d3d;
    --text: #f0f0f0; --dim: #757575; --faint: #4d4d4d; --live: #e64a29;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    min-height: 100vh; display: flex; justify-content: center;
    padding: 48px 16px calc(48px + env(safe-area-inset-bottom));
  }
  main { width: 100%; max-width: 420px; }
  .mark { font-size: 28px; letter-spacing: 10px; font-weight: 700; margin: 0 0 28px; }
  .rule { height: 1px; background: var(--line); margin: 0 0 28px; }
  .lead { font-family: -apple-system, "Hiragino Sans", sans-serif; font-size: 18px; line-height: 1.7; margin: 0 0 8px; }
  .sub { color: var(--dim); font-size: 12px; line-height: 1.8; margin: 0 0 32px; letter-spacing: .04em; }
  .label { color: var(--faint); font-size: 10px; letter-spacing: .2em; margin: 0 0 8px; }
  .code { font-size: 34px; letter-spacing: 10px; font-weight: 600; margin: 0 0 28px; }
  button, a.button {
    display: block; width: 100%; text-align: center; text-decoration: none;
    font: inherit; font-size: 13px; letter-spacing: .18em; padding: 16px 12px;
    margin: 0 0 12px; border: 1px solid var(--text); background: var(--text); color: var(--bg);
    cursor: pointer;
  }
  a.button.secondary, button.secondary { background: transparent; color: var(--text); border-color: var(--line); }
  .note { color: var(--faint); font-size: 11px; line-height: 1.8; margin: 20px 0 0; }
  .done { color: var(--live); }
</style>
</head>
<body>
<main>
  <p class="mark">ROTASH</p>
  <div class="rule"></div>
  <p class="lead">友達と1週間かけて、<br>7枚で1つの作品をつくる。</p>
  <p class="sub">撮るのは1日にひとりだけ。見るのはいつでも全員。</p>

  <p class="label">招待コード</p>
  <p class="code" id="code">------</p>

  <button id="install">コードをコピーしてアプリを入れる</button>
  <a class="button secondary" id="open" href="#">アプリを持っている人はこちら</a>

  <p class="note" id="note">アプリを入れたら、参加画面の「貼り付け」でこのコードが入ります。</p>
</main>
<script>
  // ここに App Store（公開前は TestFlight の公開リンク）の URL を入れる。docs/FIREBASE_SETUP.md
  const INSTALL_URL = "";

  // /j/ABC123 の ABC123。紛らわしい文字を除いた大文字6文字だけを受け付ける（アプリの InviteCode と同じ）。
  const raw = (location.pathname.split("/j/")[1] || "").split("/")[0];
  const code = raw.toUpperCase().replace(/[^ABCDEFGHJKLMNPQRSTUVWXYZ2-9]/g, "").slice(0, 6);
  const valid = code.length === 6;

  document.getElementById("code").textContent = valid ? code : "------";
  const open = document.getElementById("open");
  open.href = valid ? "rotash://join/" + code : "rotash://";

  const install = document.getElementById("install");
  const note = document.getElementById("note");
  install.addEventListener("click", async () => {
    if (valid) {
      try {
        // 貼り付けで入るよう、リンクごとコピーする（アプリはリンクからでもコードを読める）。
        // いつも web.app のリンクにする（firebaseapp.com で開かれても、アプリが読めるリンクに）。
        await navigator.clipboard.writeText("https://rotash-f83a4.web.app/j/" + code);
        install.textContent = "コピーしました";
        install.classList.add("done");
      } catch (e) { /* コピーできなくても、コードは画面に出ている */ }
    }
    if (INSTALL_URL) {
      setTimeout(() => { location.href = INSTALL_URL; }, 400);
    } else {
      note.textContent = "まだ App Store に出ていません。招待してくれた人に、テスト版（TestFlight）の入れ方を聞いてください。";
    }
  });
</script>
</body>
</html>
