# ---------------------------------------------------------------------------
# 正（source of truth）は Rotash.xcodeproj（オーナーが Mac の Xcode で実際に
# ビルドしているプロジェクト）。この project.yml はその写しにすぎない。
#
# The checked-in Rotash.xcodeproj is the source of truth. This XcodeGen spec is
# only a backup for regenerating it, and it MUST be kept in sync by hand:
# whenever a build setting, version, Swift package or linked product is changed
# in Xcode, mirror the same change here (compare against
# Rotash.xcodeproj/project.pbxproj). Running `xcodegen generate` overwrites
# Rotash.xcodeproj, so review `git diff Rotash.xcodeproj` afterwards and do not
# commit a regenerated project unless the diff is intended.
#
#   brew install xcodegen && xcodegen generate   # XcodeGen 2.43.0+ (synced folders)
#
# Last synced with project.pbxproj: bundle id app.takaoka.com.Rorash,
# version 0.2 (202610152100), Firebase 12.18.0 (up to next major).
# ---------------------------------------------------------------------------
name: Rotash
options:
  minimumXcodeGenVersion: 2.43.0
  developmentLanguage: en
  # knownRegions in the .xcodeproj: en, Base, ja, ko. XcodeGen derives them
  # from developmentLanguage + Base + localizations it finds (ja/ko live only in
  # Rotash/Resources/*.xcstrings). If ja/ko are missing after generating,
  # opening the String Catalog in Xcode adds them back.
  useBaseInternationalization: true
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    CLANG_CXX_LANGUAGE_STANDARD: gnu++20
    GCC_C_LANGUAGE_STANDARD: gnu17
    CLANG_ENABLE_OBJC_WEAK: YES
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SDKROOT: iphoneos
packages:
  firebase-ios-sdk:
    url: https://github.com/firebase/firebase-ios-sdk
    # pbxproj: kind = upToNextMajorVersion; minimumVersion = 12.18.0
    majorVersion: 12.18.0
targets:
  Rotash:
    type: application
    platform: iOS
    sources:
      # File-system synchronized root group, as in the .xcodeproj. Everything
      # under Rotash/ is picked up by Xcode automatically: Swift sources,
      # Resources/Assets.xcassets, Resources/AppIcon.icon,
      # Resources/Localizable.xcstrings, Resources/InfoPlist.xcstrings,
      # Resources/PrivacyInfo.xcprivacy and Services/GoogleService-Info.plist.
      # Supporting/Info.plist sits outside it and is used via INFOPLIST_FILE.
      - path: Rotash
        type: syncedFolder
    # Exactly the products the .xcodeproj links (Frameworks build phase).
    # FirebaseCore + FirebaseAnalytics (measurement), FirebaseAuth (anonymous
    # sign-in for Firestore REST), FirebaseMessaging (push). Sync itself is REST.
    dependencies:
      - package: firebase-ios-sdk
        product: FirebaseAnalytics
      - package: firebase-ios-sdk
        product: FirebaseAuth
      - package: firebase-ios-sdk
        product: FirebaseCore
      - package: firebase-ios-sdk
        product: FirebaseMessaging
    settings:
      base:
        # Must equal BUNDLE_ID in Rotash/Services/GoogleService-Info.plist.
        PRODUCT_BUNDLE_IDENTIFIER: app.takaoka.com.Rorash
        PRODUCT_NAME: $(TARGET_NAME)
        MARKETING_VERSION: "0.2"
        # Build number = 年月日時分 (YYYYMMDDHHmm). Must be larger than the last upload.
        CURRENT_PROJECT_VERSION: "202610152100"
        DEVELOPMENT_TEAM: 5B2NQ74986
        CODE_SIGN_STYLE: Automatic
        # Push notifications (aps-environment). See docs/FIREBASE_SETUP.md.
        CODE_SIGN_ENTITLEMENTS: Supporting/Rotash.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Supporting/Info.plist
        SWIFT_VERSION: "5.0"
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    # Shared scheme "Rotash" (Rotash.xcodeproj/xcshareddata/xcschemes).
    # ⌘U runs RotashTests.
    scheme:
      testTargets:
        - RotashTests
  RotashTests:
    # Unit tests for the parts that must never break: sync merge, assignment,
    # invite links, notification scheduling. Hosted in the app (@testable import Rotash).
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RotashTests
        type: syncedFolder
    dependencies:
      - target: Rotash
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.takaoka.com.RorashTests
        PRODUCT_NAME: $(TARGET_NAME)
        DEVELOPMENT_TEAM: 5B2NQ74986
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Rotash.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Rotash"
        BUNDLE_LOADER: "$(TEST_HOST)"
